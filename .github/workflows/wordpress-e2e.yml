name: Real WordPress MySQL and Chrome student E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "plugins/**/*.php"
      - "tests/run-wp-env-integration.php"
      - "tests/test-payment-complete-integration.php"
      - "tests/test-2026-double-audit-regressions.php"
      - "tests/test-100-wordpress-live-guard.php"
      - "tests/test-browser-login-selenium.py"
      - ".wp-env.json"
      - ".github/workflows/wordpress-e2e.yml"

permissions:
  contents: read

jobs:
  wordpress-woocommerce-login:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Checkout lab source
        uses: actions/checkout@v4

      - name: Verify Docker and Node
        run: |
          docker --version
          node --version
          npm --version
          google-chrome --version

      - name: Install official WordPress wp-env tool
        run: npm install --global @wordpress/env@latest

      - name: Start isolated real WordPress and MySQL containers
        run: wp-env start

      - name: Check WordPress HTTP is ready
        run: |
          curl --fail --retry 12 --retry-delay 4 --retry-connrefused http://127.0.0.1:8888/ >/dev/null

      - name: Install and activate WooCommerce
        run: wp-env run cli wp plugin install woocommerce --activate

      - name: Activate lab plugins in dependency order
        run: |
          wp-env run cli wp plugin activate woocommerce-lms-bridge
          wp-env run cli wp plugin activate lms-lab-qa-runner
          wp-env run cli wp plugin activate lms-lab-course-access
          wp-env run cli wp plugin activate lms-lab-access-qa
          wp-env run cli wp plugin activate lms-lab-talentlms-sim
          wp-env run cli wp plugin activate lms-lab-api-qa85
          wp-env run cli wp plugin activate lms-lab-browser-login
          wp-env run cli wp plugin activate lms-lab-sync-reconciliation
          wp-env run cli wp plugin activate lms-lab-qa95
          wp-env run cli wp plugin activate lms-lab-talentlms-live-readiness
          wp-env run cli wp plugin list --status=active

      - name: Use pretty WordPress permalinks
        run: wp-env run cli wp rewrite structure '/%postname%/'

      - name: Execute all four REAL WordPress integration QA suites
        run: wp-env run cli wp eval-file wp-content/lms-lab-tests/run-wp-env-integration.php

      - name: Verify gateway-style paid Processing virtual-course lifecycle
        run: wp-env run cli wp eval-file wp-content/lms-lab-tests/test-payment-complete-integration.php

      - name: Independent privacy + cancellation and failure regressions
        run: wp-env run cli wp eval-file wp-content/lms-lab-tests/test-2026-double-audit-regressions.php

      - name: Verify TalentLMS real HTTP disabled without approved tenant
        run: wp-env run cli wp eval-file wp-content/lms-lab-tests/test-100-wordpress-live-guard.php

      - name: Install Selenium in isolated Python environment
        run: |
          python3 -m venv .testvenv
          .testvenv/bin/pip install selenium

      - name: REAL Google Chrome login/cookies/lesson/logout/re-login
        env:
          LLS95_SITE_URL: http://127.0.0.1:8888
        run: .testvenv/bin/python tests/test-browser-login-selenium.py

      - name: Upload failure screenshot and wp-env logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lms-95-failure-evidence
          path: artifacts/
          if-no-files-found: ignore

      - name: Stop isolated WordPress environment
        if: always()
        run: wp-env stop || true
